
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-anomaly-detection"
version = "0.1.0"
description = "Density-based anomaly detection for retail market baskets"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.5,<2.0",
    "scipy>=1.12",
    "mlxtend>=0.23",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "joblib>=1.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27"
]

[project.optional-dependencies]
dev = [
    "streamlit>=1.40",
    "plotly>=5.24",
    "matplotlib>=3.8",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pytest>=8.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "main:app"

[tool.setuptools.packages.find]
include = ["src*"]
