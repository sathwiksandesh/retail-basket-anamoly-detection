services:
  db:
    image: postgres:16
    container_name: retail-anomaly-postgres
    environment:
      POSTGRES_DB: retail_anomaly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - retail_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retail_anomaly"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  retail_pg_data:
